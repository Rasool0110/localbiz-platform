
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalBiz | Business Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f3f5f9;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        header h2 {
            margin: 0;
            color: #2563eb;
        }

        .logout-button {
            padding: 10px 18px;
            border: 0;
            border-radius: 7px;
            background: #dc2626;
            color: white;
            cursor: pointer;
        }

        main {
            max-width: 1000px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome p {
            color: #64748b;
        }

        .business-card {
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .business-card h2 {
            margin-top: 0;
            font-size: 26px;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 25px;
        }

        .detail-box {
            padding: 18px;
            background: #f8fafc;
            border-radius: 9px;
        }

        .detail-box small {
            display: block;
            margin-bottom: 8px;
            color: #64748b;
        }

        .detail-box strong {
            overflow-wrap: anywhere;
        }

        #status {
            padding: 18px;
            background: white;
            border-radius: 10px;
            color: #64748b;
        }

        .error {
            color: #dc2626 !important;
        }

        .business-logo {
            max-width: 120px;
            max-height: 80px;
            object-fit: contain;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <header>
        <h2>LocalBiz</h2>
        <button class="logout-button" id="logoutButton">
            Sign Out
        </button>
    </header>

    <main>

        <div class="welcome">
            <h1>Business Dashboard</h1>
            <p id="userEmail">Loading account...</p>
        </div>

        <div id="status" role="status">
            Loading your business information...
        </div>

        <section class="business-card" id="businessCard" hidden>

            <img
                id="businessLogo"
                class="business-logo"
                alt="Business logo"
                hidden
            >

            <h2 id="businessName"></h2>

            <p id="businessDescription"></p>

            <div class="details">

                <div class="detail-box">
                    <small>Business Type</small>
                    <strong id="businessType"></strong>
                </div>

                <div class="detail-box">
                    <small>Your Role</small>
                    <strong id="businessRole"></strong>
                </div>

                <div class="detail-box">
                    <small>Business Slug</small>
                    <strong id="businessSlug"></strong>
                </div>

                <div class="detail-box">
                    <small>Business Status</small>
                    <strong id="businessStatus"></strong>
                </div>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>


<script>
    const localBizClient = window.localBizSupabase;

    const accountInfo = document.getElementById("accountInfo");
    const businessInfo = document.getElementById("businessInfo");
    const logoutButton = document.getElementById("logoutButton");

    async function loadDashboard() {
        try {
            // Get logged-in user session.
            const { data: sessionData, error: sessionError } =
                await localBizClient.auth.getSession();

            if (sessionError) {
                throw sessionError;
            }

            const session = sessionData.session;

            if (!session) {
                window.location.href = "./index.html";
                return;
            }

            const user = session.user;

            accountInfo.textContent = "Logged in as: " + user.email;

            // Find the active business membership for this user.
            const { data: memberships, error: membershipError } =
                await localBizClient
                    .from("business_users")
                    .select("business_id, role, is_active")
                    .eq("user_id", user.id)
                    .eq("is_active", true);

            if (membershipError) {
                throw membershipError;
            }

            if (!memberships || memberships.length === 0) {
                businessInfo.textContent =
                    "No active business membership found for this account.";
                return;
            }

            if (memberships.length > 1) {
                businessInfo.textContent =
                    "Multiple business memberships found. Business selection will be added later.";
                return;
            }

            const membership = memberships[0];

            // Retrieve the business associated with the membership.
            const { data: business, error: businessError } =
                await localBizClient
                    .from("businesses")
                    .select("id, business_name, slug, business_type, description, logo_url, status")
                    .eq("id", membership.business_id)
                    .maybeSingle();

            if (businessError) {
                throw businessError;
            }

            if (!business) {
                businessInfo.textContent =
                    "Business details could not be found.";
                return;
            }

            businessInfo.innerHTML = `
                <h2>${business.business_name}</h2>
                <p><strong>Business Type:</strong> ${business.business_type || "Not set"}</p>
                <p><strong>Role:</strong> ${membership.role}</p>
                <p><strong>Business Slug:</strong> ${business.slug}</p>
                <p><strong>Status:</strong> ${business.status}</p>
            `;

        } catch (error) {
            console.error("Dashboard loading error:", error);

            businessInfo.textContent =
                "Unable to load business information: " + error.message;
        }
    }

    // Sign out the current user.
    logoutButton.addEventListener("click", async function() {
        logoutButton.disabled = true;
        logoutButton.textContent = "Signing out...";

        try {
            const { error } = await localBizClient.auth.signOut();

            if (error) {
                throw error;
            }

            window.location.href = "./index.html";

        } catch (error) {
            console.error("Sign out error:", error);
            businessInfo.textContent =
                "Sign out failed: " + error.message;

            logoutButton.disabled = false;
            logoutButton.textContent = "Sign Out";
        }
    });

    // Load dashboard information.
    loadDashboard();
</script>


</body>
</html>
